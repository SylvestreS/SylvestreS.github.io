<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TI-Nspire CX II CAS · 网页版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="nspire">
    <div class="machine">

      <!-- 屏幕边框 -->
      <div class="screen-frame">
        <div class="screen" id="screen">
          <div class="lcd" id="lcd">
            <!-- 由 app.js 渲染 -->
          </div>
        </div>

        <!-- 顶部品牌条 -->
        <div class="screen-brand">
          <span class="brand-line1">
            <span class="brand-ti">TI</span><span class="brand-nspire">-Nspire™</span><span class="brand-cx"> CX II</span>
          </span>
          <span class="brand-line2">Texas Instruments</span>
          <span class="brand-line3">CAS</span>
        </div>
      </div>

      <!-- Touchpad + 周围按键 + Clicker 标签 -->
      <div class="touchpad-section">
        <div class="side-keys left">
          <button class="key mod"  data-key="esc">esc</button>
          <button class="key mod"  data-key="home" title="显示主屏幕">⌂</button>
          <button class="key mod"  data-key="doc">doc▼</button>
          <button class="key mod"  data-key="tab">tab</button>
        </div>

        <div class="touchpad-wrap">
          <div class="touchpad" id="touchpad">
            <div class="tp-up"    data-dir="up">▲</div>
            <div class="tp-right" data-dir="right">▶</div>
            <div class="tp-down"  data-dir="down">▼</div>
            <div class="tp-left"  data-dir="left">◀</div>
            <div class="tp-center"></div>
          </div>
          <div class="tp-label">Clicker</div>
        </div>

        <div class="side-keys right">
          <button class="key mod"  data-key="on"   title="开关">on</button>
          <button class="key mod"  data-key="page">page▢</button>
          <button class="key mod"  data-key="doc2">doc▢</button>
          <button class="key mod"  data-key="menu">menu</button>
        </div>
      </div>

      <!-- 主键盘区 -->
      <div class="keyboard">

        <!-- 1. 顶栏（光圈装饰：CAPS / sto→ / clear 在键上方印字） -->
        <div class="key-row label-row">
          <span class="lbl">CAPS</span>
          <span class="lbl">sto&#x2192;</span>
          <span class="lbl lbl-right">clear</span>
        </div>

        <!-- 2. 修饰 + 数学符号 + 数字混合行（照片中央那一排） -->
        <div class="key-row ctrl-row">
          <button class="key mod mod-ctrl" data-key="ctrl">ctrl</button>
          <button class="key"   data-char="0">0</button>
          <button class="key sym" data-action="sin">sin</button>
          <button class="key mod mod-shift" data-key="E" data-action="ee">E<span class="abbr">(EE)</span></button>
          <button class="key sym" data-key="var">var</button>
          <button class="key"   data-action="del" id="del-top" title="删除">del</button>

          <button class="key num" data-char="7">7</button>
          <button class="key num" data-char="8">8</button>
          <button class="key num" data-char="9">9</button>

          <button class="key sym" data-action="catlg">catlg</button>
          <button class="key nav-up" data-dir="up">↑</button>
        </div>

        <!-- 3. 模板符号行 -->
        <div class="key-row templates">
          <button class="key sym" data-action="fraction">x⁄y</button>
          <button class="key sym" data-action="power">^</button>
          <button class="key sym" data-action="power2">x²</button>
          <button class="key sym" data-action="sqrt">√(</button>
          <button class="key sym" data-action="log">log</button>
          <button class="key sym" data-action="ln">ln</button>

          <button class="key num" data-char="4">4</button>
          <button class="key num" data-char="5">5</button>
          <button class="key num" data-char="6">6</button>

          <button class="key sym" data-action="angle">∠</button>
          <button class="key nav-left" data-dir="left">←</button>
          <button class="key nav-right" data-dir="right">→</button>
        </div>

        <!-- 4. π / 三脚 / 模板 + 数字 123 + enter -->
        <div class="key-row pi-row">
          <button class="key sym" data-char="π">π</button>
          <button class="key sym" data-action="frac">a⁄b</button>
          <button class="key sym" data-action="integral">∫</button>
          <button class="key sym" data-action="d_dx">d⁄dx</button>
          <button class="key sym" data-action="power-1">x⁻¹</button>
          <button class="key sym" data-action="power-3">x⁻³</button>

          <button class="key num" data-char="1">1</button>
          <button class="key num" data-char="2">2</button>
          <button class="key num" data-char="3">3</button>

          <button class="key sym" data-action="comma">,</button>
          <button class="key nav-down" data-dir="down">↓</button>
          <button class="key enter big" data-action="enter">enter</button>
        </div>

        <!-- 5. 三脚 / 三脚 / 三角函数 + 数字 0.±- + enter 续 -->
        <div class="key-row trig-row">
          <button class="key sym" data-action="cos">cos</button>
          <button class="key sym" data-action="tan">tan</button>
          <button class="key sym" data-char="θ">θ</button>
          <button class="key sym" data-action="approx">≈</button>
          <button class="key sym" data-action="ans">Ans</button>
          <button class="key sym" data-action="flag">▷</button>

          <button class="key num" data-char="0">0</button>
          <button class="key num" data-char=".">.</button>
          <button class="key num" data-action="negate">(-)</button>

          <button class="key sym" data-action="flag2">flag</button>
          <button class="key enter big" data-action="enter">↵</button>
        </div>

        <!-- 5.5 运算行：+ − × ÷ 放最显眼处 -->
        <div class="key-row ops-row">
          <button class="key op" data-char="+">+</button>
          <button class="key op" data-char="-">−</button>
          <button class="key op" data-char="*">×</button>
          <button class="key op" data-char="/">÷</button>
          <button class="key sym" data-char="(">(</button>
          <button class="key sym" data-char=")">)</button>
          <button class="key sym" data-char=",">,</button>
          <button class="key sym" data-action="assign">:=</button>
          <button class="key sym" data-action="le">≤</button>
          <button class="key sym" data-action="ge">≥</button>
        </div>

        <!-- 6. 底部：英文 / 字母键盘 5 列 × 6 行 + 右侧 ⌫ -->
        <div class="alpha-wrap">
          <div class="alpha-block">
            <!-- 行 1 -->
            <button class="key letter" data-char="H">H</button>
            <button class="key letter" data-char="A">A</button>
            <button class="key letter" data-char="B">B</button>
            <button class="key letter" data-char="C">C</button>
            <button class="key letter" data-char="D">D</button>
            <!-- 行 2 -->
            <button class="key letter" data-char="I">I</button>
            <button class="key letter" data-char="J">J</button>
            <button class="key letter" data-char="K">K</button>
            <button class="key letter" data-char="L">L</button>
            <button class="key letter" data-char="M">M</button>
            <!-- 行 3 -->
            <button class="key letter" data-char="N">N</button>
            <button class="key letter" data-char="O">O</button>
            <button class="key letter" data-char="P">P</button>
            <button class="key letter" data-char="Q">Q</button>
            <button class="key letter" data-char="R">R</button>
            <!-- 行 4 -->
            <button class="key letter" data-char="S">S</button>
            <button class="key letter" data-char="T">T</button>
            <button class="key letter" data-char="U">U</button>
            <button class="key letter" data-char="V">V</button>
            <button class="key letter" data-char="W">W</button>
            <!-- 行 5：X Y Z + 补全 E F -->
            <button class="key letter" data-char="X">X</button>
            <button class="key letter" data-char="Y">Y</button>
            <button class="key letter" data-char="Z">Z</button>
            <button class="key letter" data-char="E">E</button>
            <button class="key letter" data-char="F">F</button>
            <!-- 行 6：补 G θ ? + space + toggle -->
            <button class="key letter" data-char="G">G</button>
            <button class="key letter" data-char="θ">θ</button>
            <button class="key sym"   data-action="approx">≈</button>
            <button class="key space" data-action="space">space</button>
            <button class="key sym"   data-action="toggle-exact">⌐</button>
          </div>
          <button class="key backspace big" data-action="backspace">⌫</button>
        </div>

      </div>

    </div>
  </div>

  <script src="vendor/algebrite.js"></script>
  <script src="app.js"></script>
</body>
</html>
</content>
</invoke>
