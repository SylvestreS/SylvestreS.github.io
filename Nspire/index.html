<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TI-Nspire CX II CAS · 网页版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="nspire">
    <div class="machine">

      <!-- 顶部蓝色品牌条 -->
      <div class="brand-bar">
        <span class="brand-title">
          <span class="brand-ti">TI</span><span class="brand-n">-n</span>spire<span class="brand-cx"> CX II</span>
        </span>
        <span class="brand-texas">
          <svg viewBox="0 0 24 16" width="20" height="14" aria-hidden="true">
            <path d="M2 4 L11 4 L13 8 L2 8 Z" fill="#fff"/>
            <path d="M2 8 L11 8 L13 12 L2 12 Z" fill="#fff"/>
            <path d="M2 12 L11 12 L13 16 L2 16 Z" fill="#fff"/>
          </svg>
          <span class="brand-texas-text">TEXAS INSTRUMENTS</span>
        </span>
        <span class="brand-cas">CAS</span>
      </div>

      <!-- 屏幕 -->
      <div class="screen-frame">
        <div class="screen">
          <div class="lcd" id="lcd"></div>
        </div>
      </div>

      <!-- Touchpad + 左右按键 -->
      <div class="touchpad-section">
        <div class="side-keys left">
          <button class="key mod" data-key="esc">esc</button>
          <button class="key mod icon-only" data-key="home" title="home">&#x1F512;</button>
          <button class="key mod" data-key="tab">tab</button>
        </div>

        <div class="touchpad-wrap">
          <div class="tp-top-deco">&hellip;</div>
          <div class="touchpad" id="touchpad">
            <div class="tp-dot tp-up"    data-dir="up"></div>
            <div class="tp-dot tp-right" data-dir="right"></div>
            <div class="tp-dot tp-down"  data-dir="down"></div>
            <div class="tp-dot tp-left"  data-dir="left"></div>
            <div class="tp-center"></div>
          </div>
          <div class="tp-bot-deco">&#x25A2;</div>
          <div class="tp-label">Clicker</div>
          <span class="tp-off">off</span>
        </div>

        <div class="side-keys right">
          <button class="key mod" data-key="on">on</button>
          <button class="key mod icon-only" data-key="page" title="page">&#x25A2;</button>
          <button class="key mod" data-key="doc">doc<span class="mod-sub">menu</span></button>
        </div>
      </div>

      <!-- 修饰键上方小字 -->
      <div class="mod-labels">
        <span class="ml">CAPS</span>
        <span class="ml">1/0</span>
        <span class="ml">clear</span>
      </div>

      <!-- 主键盘区 -->
      <div class="keypad">

        <!-- R0 修饰键 -->
        <div class="kp-row kp-mod">
          <button class="key ctrl"  data-key="ctrl">ctrl</button>
          <button class="key shift" data-key="shift"><span class="shift-icon">&#x21E7;</span></button>
          <button class="key var"   data-key="var">var</button>
          <button class="key del"   data-key="del">del</button>
        </div>

        <!-- R1 =/trig + 789 + EE -->
        <div class="kp-row">
          <button class="key dual" data-action="equals">
            <span class="main">=</span><span class="lbl2">trig</span>
          </button>
          <button class="key num" data-char="7">7</button>
          <button class="key num" data-char="8">8</button>
          <button class="key num" data-char="9">9</button>
          <button class="key dual small-font" data-action="catlg">
            <span class="main">EE</span>
          </button>
        </div>

        <!-- R2 ^/x² + 456 + ×/÷ -->
        <div class="kp-row">
          <button class="key dual" data-action="power" data-action-shift="power2">
            <span class="main">^</span><span class="lbl2">x<sup>2</sup></span>
          </button>
          <button class="key num" data-char="4">4</button>
          <button class="key num" data-char="5">5</button>
          <button class="key num" data-char="6">6</button>
          <button class="key dual" data-char="*" data-action-shift="divide">
            <span class="main">&times;</span><span class="lbl2">&divide;</span>
          </button>
        </div>

        <!-- R3 e^x/10^x + 123 + +/− -->
        <div class="kp-row">
          <button class="key dual" data-action="e_pow" data-action-shift="ten_pow">
            <span class="main">e<sup>x</sup></span><span class="lbl2">10<sup>x</sup></span>
          </button>
          <button class="key num" data-char="1">1</button>
          <button class="key num" data-char="2">2</button>
          <button class="key num" data-char="3">3</button>
          <button class="key dual" data-char="+" data-action-shift="minus">
            <span class="main">+</span><span class="lbl2">&minus;</span>
          </button>
        </div>

        <!-- R4 () + 0 . (-) + enter -->
        <div class="kp-row">
          <button class="key dual" data-char="(" data-action-shift="paren_r">
            <span class="main">(</span><span class="lbl2">)</span>
          </button>
          <button class="key num" data-char="0">0</button>
          <button class="key num" data-char=".">.</button>
          <button class="key" data-action="negate">(&minus;)</button>
          <button class="key enter big" data-action="enter">enter</button>
        </div>

        <!-- R5 补充行：常用数学/逻辑符号 + 单独的 ) 键（保持测试兼容） -->
        <div class="kp-row kp-extra">
          <button class="key sym" data-char=")">)</button>
          <button class="key sym" data-action="approx">&asymp;</button>
          <button class="key sym" data-action="ans">Ans</button>
          <button class="key sym" data-action="comma">,</button>
          <button class="key sym" data-action="le">&le;</button>
        </div>

        <!-- 字母键盘 -->
        <div class="letters">
          <!-- 行 1 -->
          <div class="lt-row">
            <button class="key lt-icon" data-action="lt-icon1">&#x25A2;</button>
            <button class="key letter" data-char="a">a</button>
            <button class="key letter" data-char="b">b</button>
            <button class="key letter" data-char="c">c</button>
            <button class="key letter" data-char="d">d</button>
            <button class="key letter" data-char="e">e</button>
            <button class="key letter" data-char="f">f</button>
            <button class="key letter" data-char="g">g</button>
            <button class="key lt-icon" data-action="lt-icon-r1a">?</button>
          </div>
          <!-- 行 2 -->
          <div class="lt-row">
            <button class="key lt-icon" data-action="lt-icon2">&#x25A2;</button>
            <button class="key letter" data-char="h">h</button>
            <button class="key letter" data-char="i">i</button>
            <button class="key letter" data-char="j">j</button>
            <button class="key letter" data-char="k">k</button>
            <button class="key letter" data-char="l">l</button>
            <button class="key letter" data-char="m">m</button>
            <button class="key letter" data-char="n">n</button>
            <button class="key lt-icon" data-action="lt-icon-r2">?</button>
          </div>
          <!-- 行 3 -->
          <div class="lt-row">
            <button class="key lt-icon" data-action="lt-icon3">&#x25A2;</button>
            <button class="key letter" data-char="o">o</button>
            <button class="key letter" data-char="p">p</button>
            <button class="key letter" data-char="q">q</button>
            <button class="key letter" data-char="r">r</button>
            <button class="key letter" data-char="s">s</button>
            <button class="key letter" data-char="t">t</button>
            <button class="key letter" data-char="u">u</button>
            <button class="key lt-icon" data-action="backspace">&#x232B;</button>
          </div>
          <!-- 行 4 -->
          <div class="lt-row lt-row-last">
            <button class="key lt-icon" data-action="lt-icon-l4">&#x25A2;</button>
            <button class="key letter" data-char="v">v</button>
            <button class="key letter" data-char="w">w</button>
            <button class="key letter" data-char="x">x</button>
            <button class="key letter" data-char="y">y</button>
            <button class="key letter" data-char="z">z</button>
            <button class="key lt-icon" data-action="lt-icon-r4">?</button>
            <button class="key space wide" data-action="space">space</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="vendor/algebrite.js"></script>
  <script src="app.js"></script>
</body>
</html>
